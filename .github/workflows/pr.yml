name: CI

on:
  pull_request:

# Deny by default; each job opts in to only what it needs.
permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [lint, test, coverage, build, test-ui]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true

      - name: Run target
        run: |
          if [ "${{ matrix.target }}" = "test-ui" ]; then
            devbox run -- env EXTENSIONS_FOLDER=.test-extensions EXTENSION_DEV_PATH="$GITHUB_WORKSPACE" xvfb-run -a make test-ui
          elif [ "${{ matrix.target }}" = "test" ]; then
            devbox run -- xvfb-run -a make test
          else
            devbox run -- make ${{ matrix.target }}
          fi

      # Uploaded even when the run failed: a breached coverage threshold is
      # exactly when the report is worth reading.
      - name: Upload coverage report
        if: ${{ matrix.target == 'coverage' && !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage/
